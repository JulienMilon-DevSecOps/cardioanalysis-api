include:
  - project: 'project-jmilon-devsecops/ci-cd/pipeline-python-centralisee'
    ref: 0.11.1
    file: 'pipelines/python-fastapi-pipeline.yml'

variables:
  PYTHON_VERSION: "3.12"
  # Projet installé avec l'extra "dev" (pytest, pytest-cov, httpx2)
  PYTHON_PROJECT_EXTRAS: "dev"
  # Couverture mesurée sur app/ (seuil de 80 % défini dans pyproject.toml)
  PYTEST_COV_SOURCE: "app"
  # Dépendance dans le fichier pyproject.
  PYTHON_REQUIREMENTS_FILES: ""

  # Tests d'intégration : base PostgreSQL jetable (job pytest-postgres, service "postgres")
  PYTEST_DATABASE: "postgres"
  DB_HOST_TEST: "postgres"
  DB_PORT_TEST: "5432"
  DB_NAME_TEST: "$POSTGRES_DB"
  DB_USER_TEST: "$POSTGRES_USER"
  DB_PASSWORD_TEST: "$POSTGRES_PASSWORD"

  # ── Sécurité : état des contrôles (valeurs explicites, voir docs/supply-chain.md
  #    de la pipeline centralisée). La détection de secrets (gitleaks) est toujours
  #    active et bloquante, sans variable.
  # Version du tag = version du pyproject.toml (job version-check) — ACTIF, bloquant
  VERSION_CHECK_ENABLED: "true"
  # Lint et formatage Ruff — ACTIF, bloquant
  RUFF_ALLOW_FAILURE: "false"
  # SAST, règles de sécurité Ruff (job sast) — ACTIF, bloquant
  SAST_ALLOW_FAILURE: "false"
  # Vulnérabilités des dépendances Python + SBOM (job dependency-scan) — ACTIF, non bloquant
  DEPENDENCY_SCAN_ALLOW_FAILURE: "true"
  # Bonnes pratiques du Dockerfile (job dockerfile-check : root, latest dans FROM, secrets...) — ACTIF, bloquant
  DOCKERFILE_CHECK_SEVERITY: "HIGH,CRITICAL"
  DOCKERFILE_CHECK_ALLOW_FAILURE: "false"
  # Vulnérabilités de l'image + SBOM (job trivy-scan) — ACTIF, bloquant sur les CVE critiques corrigeables
  SCAN_BLOCKING_SEVERITY: "CRITICAL"
  SCAN_IGNORE_UNFIXED: "true"
  SCAN_ALLOW_FAILURE: "false"
  # Signature cosign des images publiées (job sign-image) — INACTIF, prévu avec le déploiement (0.12.0)
  IMAGE_SIGNING_ENABLED: "false"

  # ── Image Docker : Dockerfile à la racine (valeurs par défaut) ───────────────
  # Build sans push à chaque commit de branche (job docker-build-check) — INACTIF
  DOCKER_BUILD_CHECK: "false"
  # Publication : registre GitLab du projet — ACTIF ; Docker Hub — INACTIF
  PUBLISH_GITLAB: "true"
  PUBLISH_DOCKERHUB: "false"
