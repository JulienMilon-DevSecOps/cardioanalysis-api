[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cardioanalysis-api"
version = "0.1.0"
description = "REST API exposing cardiolab HRV analysis as an HTTP service"
authors = [{name = "Julien MILON", email = "julienmilon.devsecops@gmail.com"}]
readme = "README.md"
license = {file = "LICENCE"}
requires-python = ">=3.12"
keywords = [
    "hrv",
    "heart rate variability",
    "fastapi",
    "cardiology",
    "rest api",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "cardiolab>=0.3.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "psycopg2-binary>=2.9.0",
]

[project.optional-dependencies]
garmin = [
    "fitparse>=1.2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx2",
    "ruff",
]

[project.urls]
"Source"    = "https://gitlab.com/cardioanalysis/cardioanalysis-api"
"Issues"    = "https://gitlab.com/cardioanalysis/cardioanalysis-api/-/issues"
"Changelog" = "https://gitlab.com/cardioanalysis/cardioanalysis-api/-/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "D",
    "N",
    "S",
    "FAST",
]
ignore = [
    "E501",
    "D203",
    "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

fixable = [
    "E",
    "F",
    "I",
    "UP",
    "D",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-ra", "--strict-markers", "--tb=short"]
markers = [
    "integration: tests nécessitant une base PostgreSQL",
    "unit: tests unitaires purs",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
skip_covered = false
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
